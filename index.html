<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHC4th マップルートエディタ</title>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<style>
  :root{
    --bg:#14161c;
    --panel:#1c1f28;
    --panel2:#232734;
    --border:#333747;
    --text:#e8eaf0;
    --text-dim:#9aa0b0;
    --accent:#5b8cff;
    --accent2:#3f6fe0;
    --danger:#ff5d6c;
    --ok:#4dd18a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg); color:var(--text);
    overflow:hidden;
  }
  #app{
    display:flex; width:100vw; height:100vh;
  }

  /* ---------- Map area ---------- */
  #mapArea{
    position:relative;
    flex:1 1 auto;
    height:100%;
    overflow:hidden;
    background:
      linear-gradient(45deg, #1a1c24 25%, transparent 25%) -20px 0/40px 40px,
      linear-gradient(-45deg, #1a1c24 25%, transparent 25%) -20px 0/40px 40px,
      linear-gradient(45deg, transparent 75%, #1a1c24 75%) -20px 0/40px 40px,
      linear-gradient(-45deg, transparent 75%, #1a1c24 75%) -20px 0/40px 40px,
      #101218;
    touch-action:none;
    cursor:grab;
  }
  #mapArea.drawMode{ cursor:crosshair; }
  #mapArea.panning{ cursor:grabbing; }

  #mapStage{
    position:absolute; top:0; left:0;
    transform-origin:0 0;
    will-change:transform;
  }
  #mapImage{
    display:block;
    user-select:none; -webkit-user-drag:none;
    pointer-events:none;
  }
  #routeSvg{
    position:absolute; top:0; left:0;
    pointer-events:none;
    overflow:visible;
  }

  .viewControls{
    position:absolute; right:16px; bottom:16px;
    display:flex; flex-direction:column; gap:6px;
    z-index:5;
  }
  .viewControls button{
    width:38px; height:38px; border-radius:8px;
    border:1px solid var(--border); background:rgba(28,31,40,0.9);
    color:var(--text); font-size:18px; cursor:pointer;
  }
  .viewControls button:hover{ background:var(--panel2); }

  .modeBar{
    position:absolute; left:16px; top:16px; z-index:5;
    background:rgba(28,31,40,0.92); border:1px solid var(--border);
    border-radius:10px; padding:10px 12px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    max-width:min(560px, calc(100% - 32px));
  }
  .modeBar .activeStepLabel{
    font-size:13px; color:var(--text-dim);
    display:flex; align-items:center; gap:6px;
  }
  .swatch{
    display:inline-block; width:12px; height:12px; border-radius:50%;
    border:1px solid rgba(255,255,255,0.4);
  }

  .toolSwitch{
    display:flex; border:1px solid var(--border); border-radius:8px;
    overflow:hidden; flex:0 0 auto;
  }
  .toolBtn{
    padding:6px 10px; font-size:12px; background:var(--panel2); color:var(--text);
    border:none; cursor:pointer; white-space:nowrap;
  }
  .toolBtn:hover{ background:#2b3040; }
  .toolBtn.active{ background:var(--accent); color:#fff; }

  .colorSwatchBtn{
    width:18px; height:18px; border-radius:50%; flex:0 0 auto;
    border:1px solid rgba(255,255,255,0.4); cursor:pointer; padding:0;
  }
  .colorPopover{
    position:absolute; top:24px; left:0; z-index:20;
    background:#12141a; border:1px solid var(--border); border-radius:8px;
    padding:7px; box-shadow:0 6px 16px rgba(0,0,0,.5);
    display:none; grid-template-columns:repeat(5, 18px); gap:7px;
  }
  .colorPopover.show{ display:grid; }
  .colorDot{
    width:18px; height:18px; border-radius:50%; cursor:pointer; padding:0;
    border:2px solid transparent;
  }
  .colorDot.selected{ border-color:#fff; }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:360px; min-width:360px; height:100%;
    background:var(--panel);
    border-left:1px solid var(--border);
    display:flex; flex-direction:column;
  }
  #sidebar h1{
    font-size:15px; margin:0; padding:14px 16px;
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:8px;
  }
  #sidebar h1 .tag{
    font-size:11px; color:var(--text-dim); font-weight:normal;
  }
  .sec{
    padding:12px 16px; border-bottom:1px solid var(--border);
  }
  .sec h2{
    font-size:12px; color:var(--text-dim); margin:0 0 8px 0;
    text-transform:uppercase; letter-spacing:.04em;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--panel2); color:var(--text);
    border:1px solid var(--border); border-radius:8px;
    padding:8px 12px; font-size:13px; cursor:pointer;
    transition:background .15s;
  }
  .btn:hover{ background:#2b3040; }
  .btn.primary{ background:var(--accent); border-color:var(--accent2); color:#fff; }
  .btn.primary:hover{ background:var(--accent2); }
  .btn.danger{ color:var(--danger); }
  .btn.small{ padding:5px 8px; font-size:12px; }
  .btn.wide{ width:100%; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .row{ display:flex; gap:8px; }
  .row.wrap{ flex-wrap:wrap; }

  .toggleSwitch{
    position:relative; width:40px; height:22px; flex:0 0 auto;
  }
  .toggleSwitch input{ opacity:0; width:0; height:0; }
  .toggleSlider{
    position:absolute; inset:0; background:#3a3f4f; border-radius:22px;
    cursor:pointer; transition:.15s;
  }
  .toggleSlider::before{
    content:""; position:absolute; width:16px; height:16px; left:3px; top:3px;
    background:#fff; border-radius:50%; transition:.15s;
  }
  .toggleSwitch input:checked + .toggleSlider{ background:var(--accent); }
  .toggleSwitch input:checked + .toggleSlider::before{ transform:translateX(18px); }

  #stepList{
    flex:1 1 auto; overflow-y:auto; padding:10px 12px;
  }
  .stepCard{
    background:var(--panel2); border:2px solid var(--border);
    border-radius:10px; padding:10px; margin-bottom:10px;
    cursor:pointer;
  }
  .stepCard.active{
    border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent) inset;
  }
  .stepCard .cardTop{
    display:flex; align-items:center; gap:8px; margin-bottom:8px;
  }
  .stepCard input[type=text]{
    flex:1 1 auto; min-width:0;
    background:#12141a; border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:6px 8px; font-size:13px;
  }
  .stepCard textarea{
    width:100%; min-height:52px; resize:vertical;
    background:#12141a; border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:6px 8px; font-size:12.5px; font-family:inherit;
    margin-top:6px;
  }
  .stepCard .cardBottom{
    display:flex; align-items:center; gap:6px; margin-top:8px;
  }
  .iconBtn{
    width:30px; height:30px; border-radius:6px; border:1px solid var(--border);
    background:#12141a; color:var(--text); cursor:pointer; font-size:14px;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .iconBtn:hover{ background:#1c202c; }
  .iconBtn:disabled{ opacity:.35; cursor:not-allowed; }
  .iconBtn:disabled:hover{ background:#12141a; }
  .stepMeta{ font-size:11px; color:var(--text-dim); flex:1 1 auto; }

  #dataSec .btn{ margin-bottom:8px; }
  #shareUrlBox{
    width:100%; margin-top:6px; background:#12141a; color:var(--text-dim);
    border:1px solid var(--border); border-radius:6px; padding:6px 8px;
    font-size:11px;
  }

  #toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:#20232e; border:1px solid var(--border); color:var(--text);
    padding:10px 16px; border-radius:8px; font-size:13px;
    opacity:0; pointer-events:none; transition:.25s;
    z-index:50; box-shadow:0 6px 20px rgba(0,0,0,.4);
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:#3a3f4f; border-radius:5px; }
  ::-webkit-scrollbar-track{ background:transparent; }
</style>
</head>
<body>
<div id="app">
  <div id="mapArea">
    <div id="mapStage">
      <img id="mapImage" src="" alt="map">
      <svg id="routeSvg"></svg>
    </div>

    <div class="modeBar">
      <label class="toggleSwitch">
        <input type="checkbox" id="drawModeToggle">
        <span class="toggleSlider"></span>
      </label>
      <span style="font-size:13px;">ルート描画モード</span>
      <span class="activeStepLabel">
        対象: <span class="swatch" id="activeSwatch"></span>
        <span id="activeStepName">-</span>
      </span>
      <div class="toolSwitch" id="toolSwitch">
        <button type="button" class="toolBtn active" data-tool="line">線</button>
        <button type="button" class="toolBtn" data-tool="mark">○ マーク</button>
      </div>
      <button class="btn small" id="straightenBtn" disabled title="描画中の点線を直線に補正します">直線に補正</button>
      <button class="btn small" id="commitLineBtn" disabled>線を確定</button>
      <button class="btn small" id="cancelLineBtn" disabled>取消</button>
    </div>

    <div class="viewControls">
      <button id="zoomInBtn" title="拡大">＋</button>
      <button id="zoomOutBtn" title="縮小">－</button>
      <button id="fitBtn" title="全体表示">⤢</button>
    </div>
  </div>

  <div id="sidebar">
    <h1>GHC4th ルートエディタ <span class="tag">Map Route Tool</span></h1>

    <div class="sec" id="mapSec">
      <h2>マップ操作</h2>
      <div class="row">
        <button class="btn" id="changeMapBtn">🖼 画像を選択</button>
        <button class="btn" id="resetMapBtn" disabled>デフォルトに戻す</button>
      </div>
      <div id="mapStatusLabel" style="font-size:11px; color:var(--text-dim); margin-top:8px;">デフォルト地図を使用中</div>
      <div style="font-size:11px; color:var(--text-dim); margin-top:4px;">※選択した画像はこのブラウザ内にのみ一時保存されます（サーバーには送信されません／共有URLには含まれません）</div>
      <input type="file" id="mapFileInput" accept="image/*" style="display:none">
    </div>

    <div class="sec">
      <h2>ステップ操作</h2>
      <button class="btn primary wide" id="addStepBtn">＋ 新しいステップを追加</button>
    </div>

    <div class="sec" style="flex:1 1 auto; display:flex; flex-direction:column; padding:0; border-bottom:none; min-height:0;">
      <h2 style="padding:12px 16px 0 16px;">ステップ一覧</h2>
      <div id="stepList"></div>
    </div>

    <div class="sec" id="dataSec">
      <h2>データ操作</h2>
      <button class="btn wide" id="saveBtn">💾 LocalStorageに保存</button>
      <button class="btn wide" id="shareBtn">🔗 共有URLを発行</button>
      <input type="text" id="shareUrlBox" readonly placeholder="発行されたURLがここに表示されます">
      <button class="btn wide danger" id="resetBtn" style="margin-top:10px;">🗑 全データをリセット</button>
    </div>
  </div>
</div>

<div id="toast"></div>

      fill: "none",
      stroke: openPolylineStepId ? (state.steps.find(s=>s.id===openPolylineStepId)||{}).color || "#fff" : "#fff",
      "stroke-width": 6,
      "stroke-dasharray": "10 8",
      "stroke-linecap": "round",
      "stroke-linejoin": "round",
      opacity: 0.85
    });
    routeSvg.appendChild(previewEl);
  }

  function updateOpenPreviewOnly(){
    let previewEl = document.getElementById("openPreview");
    if(!previewEl){ renderSvg(); return; }
    previewEl.setAttribute("points", pointsAttr(openPolyline));
    const step = state.steps.find(s=>s.id===openPolylineStepId);
    if(step) previewEl.setAttribute("stroke", step.color);
  }

  function renderModeBar(){
    const active = getActiveStep();
    el("activeStepName").textContent = active ? active.name : "(未選択)";
    el("activeSwatch").style.background = active ? active.color : "#666";
    el("commitLineBtn").disabled = openPolyline.length < 2;
    el("cancelLineBtn").disabled = openPolyline.length === 0;
    el("straightenBtn").disabled = openPolyline.length < 3;
    el("drawModeToggle").checked = isDrawMode;
    mapArea.classList.toggle("drawMode", isDrawMode);

    const isLineTool = drawTool === "line";
    el("straightenBtn").style.display = isLineTool ? "" : "none";
    el("commitLineBtn").style.display = isLineTool ? "" : "none";
    el("cancelLineBtn").style.display = isLineTool ? "" : "none";
    document.querySelectorAll("#toolSwitch .toolBtn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.tool === drawTool);
    });
  }

  function renderSidebar(){
    stepListEl.innerHTML = "";
    state.steps.forEach(step => {
      const card = document.createElement("div");
      card.className = "stepCard" + (step.id === state.activeStepId ? " active" : "");
      card.dataset.id = step.id;

      const top = document.createElement("div");
      top.className = "cardTop";

      const swatchWrap = document.createElement("div");
      swatchWrap.style.position = "relative";
      swatchWrap.style.flex = "0 0 auto";

      const swatchBtn = document.createElement("button");
      swatchBtn.type = "button";
      swatchBtn.className = "colorSwatchBtn";
      swatchBtn.style.background = step.color;
      swatchBtn.title = "ルートの色を変更";

      const colorPopover = document.createElement("div");
      colorPopover.className = "colorPopover";
      PALETTE.forEach(c => {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "colorDot" + (c === step.color ? " selected" : "");
        dot.style.background = c;
        dot.title = c;
        dot.addEventListener("click", e => {
          e.stopPropagation();
          step.color = c;
          colorPopover.classList.remove("show");
          renderSvg();
          renderSidebar();
          renderModeBar();
          persist();
        });
        colorPopover.appendChild(dot);
      });
      swatchBtn.addEventListener("click", e => {
        e.stopPropagation();
        document.querySelectorAll(".colorPopover.show").forEach(p => {
          if(p !== colorPopover) p.classList.remove("show");
        });
        colorPopover.classList.toggle("show");
      });
      swatchWrap.appendChild(swatchBtn);
      swatchWrap.appendChild(colorPopover);

      const visToggle = document.createElement("label");
      visToggle.className = "toggleSwitch";
      visToggle.style.width = "34px"; visToggle.style.height = "19px";
      visToggle.title = "表示切替";
      visToggle.addEventListener("click", e => e.stopPropagation());
      const visInput = document.createElement("input");
      visInput.type = "checkbox";
      visInput.checked = step.visible;
      visInput.addEventListener("change", () => {
        step.visible = visInput.checked;
        renderSvg();
        persist();
      });
      const visSlider = document.createElement("span");
      visSlider.className = "toggleSlider";
      visToggle.appendChild(visInput);
      visToggle.appendChild(visSlider);

      const nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.value = step.name;
      nameInput.addEventListener("click", e => e.stopPropagation());
      nameInput.addEventListener("input", () => {
        step.name = nameInput.value;
        renderModeBar();
        debouncedPersist();
      });

      top.appendChild(swatchWrap);
      top.appendChild(visToggle);
      top.appendChild(nameInput);

      const commentArea = document.createElement("textarea");
      commentArea.placeholder = "コメントを入力...";
      commentArea.value = step.comment;
      commentArea.addEventListener("click", e => e.stopPropagation());
      commentArea.addEventListener("input", () => {
        step.comment = commentArea.value;
        debouncedPersist();
      });

      const bottom = document.createElement("div");
      bottom.className = "cardBottom";

      const meta = document.createElement("span");
      meta.className = "stepMeta";
      meta.textContent = step.segments.length + " 本の線 / " + (step.marks || []).length + " 個のマーク";

      const undoBtn = document.createElement("button");
      undoBtn.className = "iconBtn";
      undoBtn.title = "このステップの最後の線を1本取り消す";
      undoBtn.textContent = "↩";
      undoBtn.disabled = step.segments.length === 0;
      undoBtn.addEventListener("click", e => {
        e.stopPropagation();
        undoLastSegmentOfStep(step.id);
      });

      const delBtn = document.createElement("button");
      delBtn.className = "iconBtn";
      delBtn.title = "ステップを削除";
      delBtn.textContent = "🗑";
      delBtn.addEventListener("click", e => {
        e.stopPropagation();
        deleteStep(step.id);
      });

      bottom.appendChild(meta);
      bottom.appendChild(undoBtn);
      bottom.appendChild(delBtn);

      card.appendChild(top);
      card.appendChild(commentArea);
      card.appendChild(bottom);

      card.addEventListener("click", () => setActiveStep(step.id));

      stepListEl.appendChild(card);
    });
  }

  function renderAll(){
    renderSvg();
    renderSidebar();
    renderModeBar();
  }

  /* ---------------- Actions ---------------- */
  function addStep(){
    const step = newStep();
    state.steps.push(step);
    state.activeStepId = step.id;
    renderAll();
    persist();
  }

  function deleteStep(id){
    if(!confirm("このステップを削除しますか？描画された線とコメントも削除されます。")) return;
    state.steps = state.steps.filter(s => s.id !== id);
    if(state.activeStepId === id){
      state.activeStepId = state.steps.length ? state.steps[0].id : null;
    }
    if(openPolylineStepId === id){ openPolyline = []; openPolylineStepId = null; }
    renderAll();
    persist();
  }

  function setActiveStep(id){
    commitOrDiscardOpenPolyline();
    state.activeStepId = id;
    renderAll();
  }

  function commitOpenPolyline(){
    if(openPolyline.length >= 2 && openPolylineStepId){
      const step = state.steps.find(s => s.id === openPolylineStepId);
      if(step){
        step.segments.push(openPolyline.slice());
      }
    }
    openPolyline = [];
    openPolylineStepId = null;
  }
  function discardOpenPolyline(){
    openPolyline = [];
    openPolylineStepId = null;
  }
  function commitOrDiscardOpenPolyline(){
    if(openPolyline.length >= 2){ commitOpenPolyline(); persist(); }
    else discardOpenPolyline();
  }
  function straightenOpenPolyline(){
    if(openPolyline.length < 2) return;
    const first = openPolyline[0];
    const last = openPolyline[openPolyline.length - 1];
    openPolyline = [first, last];
    updateOpenPreviewOnly();
    renderModeBar();
  }

  function undoLastSegmentOfStep(stepId){
    const step = state.steps.find(s => s.id === stepId);
    if(!step || step.segments.length === 0){
      showToast("取り消せる線がありません");
      return;
    }
    step.segments.pop();
    renderAll();
    persist();
  }

  function toggleMarkAtPoint(step, imgPt){
    const hitIndex = step.marks.findIndex(m => Math.hypot(m.x - imgPt.x, m.y - imgPt.y) <= MARK_RADIUS);
    if(hitIndex >= 0){
      step.marks.splice(hitIndex, 1);
    } else {
      step.marks.push(imgPt);
    }
    renderSvg();
    renderSidebar();
    persist();
  }

  /* ---------------- Pointer / draw / pan / zoom ---------------- */
  function distance(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function midpoint(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }

  function isUiChromeTarget(e){
    return !!(e.target && e.target.closest && e.target.closest(".modeBar, .viewControls"));
  }

  mapArea.addEventListener("pointerdown", (e) => {
    if(isUiChromeTarget(e)) return;
    try{ mapArea.setPointerCapture(e.pointerId); }catch(err){}
    const vp = clientToViewport(e.clientX, e.clientY);
    activePointers.set(e.pointerId, vp);

    if(activePointers.size === 1){
      if(isDrawMode && drawTool === "mark"){
        const step = getActiveStep();
        if(!step){
          showToast("先にステップを選択してください");
          return;
        }
        const imgPt = clientToImage(e.clientX, e.clientY);
        toggleMarkAtPoint(step, imgPt);
      } else if(isDrawMode){
        if(!state.activeStepId){
          showToast("先にステップを選択してください");
          return;
        }
        isDrawingStroke = true;
        strokeMoved = false;
        const imgPt = clientToImage(e.clientX, e.clientY);
        if(openPolylineStepId && openPolylineStepId !== state.activeStepId){
          commitOrDiscardOpenPolyline();
        }
        openPolylineStepId = state.activeStepId;
        openPolyline.push(imgPt);
        updateOpenPreviewOnly();
        renderModeBar();
      } else {
        mapArea.classList.add("panning");
        panState = { startX: vp.x, startY: vp.y, startTx: view.tx, startTy: view.ty };
      }
    } else if(activePointers.size === 2){
      isDrawingStroke = false;
      panState = null;
      const pts = Array.from(activePointers.values());
      pinchState = { dist: distance(pts[0], pts[1]), center: midpoint(pts[0], pts[1]) };
    }
  });

  mapArea.addEventListener("pointermove", (e) => {
    if(!activePointers.has(e.pointerId)) return;
    const vp = clientToViewport(e.clientX, e.clientY);
    activePointers.set(e.pointerId, vp);

    if(activePointers.size === 1){
      if(isDrawMode && isDrawingStroke){
        strokeMoved = true;
        const imgPt = clientToImage(e.clientX, e.clientY);
        const last = openPolyline[openPolyline.length - 1];
        if(!last || distance(last, imgPt) > 3){
          openPolyline.push(imgPt);
          updateOpenPreviewOnly();
          renderModeBar();
        }
      } else if(panState){
        view.tx = panState.startTx + (vp.x - panState.startX);
        view.ty = panState.startTy + (vp.y - panState.startY);
        applyStageTransform();
      }
    } else if(activePointers.size === 2 && pinchState){
      const pts = Array.from(activePointers.values());
      const newDist = distance(pts[0], pts[1]);
      const newCenter = midpoint(pts[0], pts[1]);
      view.tx += (newCenter.x - pinchState.center.x);
      view.ty += (newCenter.y - pinchState.center.y);
      const factor = newDist / (pinchState.dist || newDist);
      zoomAt(newCenter.x, newCenter.y, factor);
      pinchState = { dist: newDist, center: newCenter };
    }
  });

  function endPointer(e){
    activePointers.delete(e.pointerId);
    try{ mapArea.releasePointerCapture(e.pointerId); }catch(err){}

    if(activePointers.size === 0){
      if(isDrawMode && isDrawingStroke){
        if(!strokeMoved){
          // simple click: point already pushed on pointerdown, keep polyline open
        }
        isDrawingStroke = false;
      }
      panState = null;
      pinchState = null;
      mapArea.classList.remove("panning");
    } else if(activePointers.size === 1){
      pinchState = null;
      const remaining = Array.from(activePointers.values())[0];
      if(!isDrawMode){
        panState = { startX: remaining.x, startY: remaining.y, startTx: view.tx, startTy: view.ty };
      }
    }
  }
  mapArea.addEventListener("pointerup", endPointer);
  mapArea.addEventListener("pointercancel", endPointer);

  mapArea.addEventListener("wheel", (e) => {
    if(isUiChromeTarget(e)) return;
    e.preventDefault();
    const vp = clientToViewport(e.clientX, e.clientY);
    const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
    zoomAt(vp.x, vp.y, factor);
  }, { passive:false });

  el("zoomInBtn").addEventListener("click", () => {
    const rect = mapArea.getBoundingClientRect();
    zoomAt(rect.width/2, rect.height/2, 1.25);
  });
  el("zoomOutBtn").addEventListener("click", () => {
    const rect = mapArea.getBoundingClientRect();
    zoomAt(rect.width/2, rect.height/2, 1/1.25);
  });
  el("fitBtn").addEventListener("click", fitToView);

  el("drawModeToggle").addEventListener("change", (e) => {
    isDrawMode = e.target.checked;
    if(!isDrawMode){
      commitOrDiscardOpenPolyline();
      renderAll();
      persist();
    } else {
      renderModeBar();
    }
  });
  el("commitLineBtn").addEventListener("click", () => {
    commitOpenPolyline();
    renderAll();
    persist();
  });
  el("cancelLineBtn").addEventListener("click", () => {
    discardOpenPolyline();
    renderAll();
  });
  el("straightenBtn").addEventListener("click", straightenOpenPolyline);

  document.querySelectorAll("#toolSwitch .toolBtn").forEach(btn => {
    btn.addEventListener("click", () => {
      if(drawTool === "line"){
        commitOrDiscardOpenPolyline();
      }
      drawTool = btn.dataset.tool;
      renderAll();
      persist();
    });
  });

  el("addStepBtn").addEventListener("click", addStep);

  document.addEventListener("click", () => {
    document.querySelectorAll(".colorPopover.show").forEach(p => p.classList.remove("show"));
  });

  window.addEventListener("resize", () => { /* keep current view */ });

  /* ---------------- Persistence ---------------- */
  let persistTimer = null;
  function debouncedPersist(){
    clearTimeout(persistTimer);
    persistTimer = setTimeout(persist, 500);
  }
  function persist(){
    try{
      localStorage.setItem(LS_KEY, JSON.stringify(state));
    }catch(err){
      console.warn("save failed", err);
    }
  }
  function loadFromLocalStorage(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if(!raw) return false;
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.steps)){
        state = parsed;
        return true;
      }
    }catch(err){ console.warn("load failed", err); }
    return false;
  }

  el("saveBtn").addEventListener("click", () => {
    persist();
    showToast("LocalStorageに保存しました");
  });

  el("resetBtn").addEventListener("click", () => {
    if(!confirm("すべてのステップ・ルート・コメントを削除します。よろしいですか？")) return;
    state = { steps: [], activeStepId: null };
    openPolyline = []; openPolylineStepId = null;
    localStorage.removeItem(LS_KEY);
    renderAll();
  });

  /* ---------------- Share URL (pako deflate + base64url) ---------------- */
  function toBase64Url(bytes){
    let binary = "";
    const chunkSize = 0x8000;
    for(let i=0; i<bytes.length; i+=chunkSize){
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunkSize));
    }
    return btoa(binary).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }
  function fromBase64Url(str){
    str = str.replace(/-/g,"+").replace(/_/g,"/");
    while(str.length % 4) str += "=";
    const binary = atob(str);
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  function buildShareUrl(){
    const json = JSON.stringify(state);
    const utf8 = new TextEncoder().encode(json);
    const compressed = window.pako.deflate(utf8);
    const encoded = toBase64Url(compressed);
    return location.origin + location.pathname + "#data=" + encoded;
  }

  function parseShareHash(){
    const hash = location.hash;
    const m = hash.match(/#data=([^&]+)/);
    if(!m) return false;
    try{
      const compressed = fromBase64Url(decodeURIComponent(m[1]));
      const utf8 = window.pako.inflate(compressed);
      const json = new TextDecoder().decode(utf8);
      const parsed = JSON.parse(json);
      if(parsed && Array.isArray(parsed.steps)){
        state = parsed;
        return true;
      }
    }catch(err){
      console.warn("failed to parse share url", err);
      showToast("共有URLの読み込みに失敗しました");
    }
    return false;
  }

  el("shareBtn").addEventListener("click", () => {
    const url = buildShareUrl();
    el("shareUrlBox").value = url;
    persist();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(() => {
        showToast("共有URLをコピーしました");
      }).catch(() => {
        showToast("URLを発行しました（手動でコピーしてください）");
      });
    } else {
      showToast("URLを発行しました（手動でコピーしてください）");
    }
  });

  /* ---------------- Custom map image storage (IndexedDB, browser-local only) ---------------- */
  const IDB_NAME = "ghc4th_map_editor_db";
  const IDB_STORE = "maps";
  const IDB_KEY = "customMap";

  function idbOpen(){
    return new Promise((resolve, reject) => {
      if(!window.indexedDB){ reject(new Error("indexedDB not supported")); return; }
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbSaveMap(blob){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put(blob, IDB_KEY);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function idbLoadMap(){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readonly");
      const req = tx.objectStore(IDB_STORE).get(IDB_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbDeleteMap(){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).delete(IDB_KEY);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function loadMapImage(blobOrNull){
    return new Promise((resolve) => {
      const url = blobOrNull ? URL.createObjectURL(blobOrNull) : MAP_IMAGE_URL;
      const prevObjectUrl = currentObjectUrl;
      currentObjectUrl = blobOrNull ? url : null;
      mapImage.onload = () => {
        imgW = mapImage.naturalWidth;
        imgH = mapImage.naturalHeight;
        mapImage.style.width = imgW + "px";
        mapImage.style.height = imgH + "px";
        mapStage.style.width = imgW + "px";
        mapStage.style.height = imgH + "px";
        fitToView();
        renderAll();
        if(prevObjectUrl) URL.revokeObjectURL(prevObjectUrl);
        resolve();
      };
      mapImage.src = url;
    });
  }

  function updateMapControlsUI(){
    el("resetMapBtn").disabled = !hasCustomMap;
    el("mapStatusLabel").textContent = hasCustomMap ? "カスタム地図を使用中（このブラウザ内保存）" : "デフォルト地図を使用中";
  }

  el("changeMapBtn").addEventListener("click", () => el("mapFileInput").click());
  el("mapFileInput").addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!file) return;
    if(!file.type.startsWith("image/")){
      showToast("画像ファイルを選択してください");
      return;
    }
    const hasAnySegments = state.steps.some(s => s.segments.length > 0);
    if(hasAnySegments && !confirm("地図を差し替えると、既存のルートの位置が新しい画像とずれる場合があります。続行しますか？")){
      return;
    }
    await loadMapImage(file);
    hasCustomMap = true;
    updateMapControlsUI();
    try{
      await idbSaveMap(file);
      showToast("地図画像を差し替えました（このブラウザ内にのみ保存されます）");
    }catch(err){
      console.warn("failed to persist map image", err);
      showToast("地図を表示しましたが保存には失敗しました（再読み込みで元に戻ります）");
    }
  });
  el("resetMapBtn").addEventListener("click", async () => {
    if(!hasCustomMap) return;
    if(!confirm("デフォルトの地図に戻しますか？")) return;
    await loadMapImage(null);
    hasCustomMap = false;
    updateMapControlsUI();
    try{ await idbDeleteMap(); }catch(err){ console.warn("failed to delete stored map image", err); }
    showToast("デフォルトの地図に戻しました");
  });

  /* ---------------- Init ---------------- */
  function ensureAtLeastOneStep(){
    if(state.steps.length === 0){
      const step = newStep("ステップ1");
      state.steps.push(step);
      state.activeStepId = step.id;
    } else if(!state.activeStepId){
      state.activeStepId = state.steps[0].id;
    }
    normalizeSteps();
  }

  async function init(){
    const loadedFromUrl = parseShareHash();
    if(!loadedFromUrl){
      loadFromLocalStorage();
    }
    ensureAtLeastOneStep();

    let customBlob = null;
    try{ customBlob = await idbLoadMap(); }catch(err){ /* indexedDB unavailable; fall back to default map */ }

    hasCustomMap = !!customBlob;
    updateMapControlsUI();
    await loadMapImage(customBlob || null);

    if(loadedFromUrl){
      persist();
      showToast("共有データを読み込みました");
    }
  }

  init();
})();
</script>
</body>
</html>
